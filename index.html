<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Atrapa el Valiente Conejo</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
  <link rel="stylesheet" href="./style.css">

</head>

<body>

  <div id="world"></div>

  <div id="gameoverInstructions">Fin del juego</div>

  <div id="gameOverOverlay"></div>
  
  <div id="newHighScoreScreen" style="display: none;">
    <h2>¡NUEVO RÉCORD!</h2>
    <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="10">
    <button id="saveScoreButton">Guardar</button>
  </div>

  <div id="dist">
    <div class="score-container">
      <div class="label">Distancia</div>
      <div id="distValue">000</div>
    </div>
    <div class="score-container" id="bestScoreContainer" style="display: none;">
      <div class="label" id="bestScoreLabel">Récord</div>
      <div id="bestDistValue">000</div>
    </div>
  </div>

  <div id="instructions">
    Haz click para saltar
    <span class="lightInstructions">Toma las zanahorias / evita los erizos</span>
  </div>

  <div id="startScreen">
    <h1 id="gameTitle">Atrapa al Valiente Conejo</h1>
    <button id="startButton">Comienza el juego</button>
  </div>

  <div id="audioToggle">
    <button id="audioButton">🔊</button>
  </div>


  <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r80/three.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/1.19.0/TweenMax.min.js'></script>
  <script src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/264161/OrbitControls.js'></script>
  <script src="./js/main.js"></script>
  <script src="./js/scene.js"></script>
  <script src="./js/audio.js"></script>
  <script src="./js/environment.js"></script>
  <script src="./js/hero.js"></script>
  <script src="./js/monster.js"></script>
  <script src="./js/elements.js"></script>
  <script src="./js/tree.js"></script>

</body>

</html>
